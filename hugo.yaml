baseURL: https://plainsight-systems.com
languageCode: en-us
title: Plainsight Systems
theme: hugo-theme-operator

params:
  description: "Plainsight Systems is an independent research vehicle — an LLC used to explore edge-native and on-device AI and publish open-source work under a clean legal and licensing structure."
  domain: plainsight-systems.com
  entity: "Plainsight Systems LLC"

  # Custom CSS — loaded via Hugo pipes in head.html override
  customCSS: ["css/overrides.css"]

  # OG / Social
  ogImage: /images/social-card.png
  twitterCard: summary_large_image

  # Footer
  footerText: "Plainsight Systems LLC — registered in Arizona, USA."

# Sitemap
sitemap:
  changefreq: monthly
  priority: 0.5

# Taxonomies
taxonomies:
  tag: tags
  category: categories

# Markup — allow unsafe so we can embed inline html in content where needed
markup:
  goldmark:
    renderer:
      unsafe: true
    # Math: \( \) inline and \[ \] display only, rendered at build time by
    # layouts/_markup/render-passthrough.html. Dollar signs are never math,
    # here or in the pandoc PDF build, so "$431K" stays literal everywhere.
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
          inline:
            - ['\(', '\)']
    # A standalone image is a block, so the image render hook can emit a
    # numbered <figure> for it.
    parser:
      wrapStandAloneImageWithinParagraph: false
  highlight:
    style: github
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

# Build
build:
  writeStats: true

# Minify
minify:
  disableCSS: false
  disableHTML: false
  disableJS: false

# Main menu. pageRef (not url) so templates can tell which entry is
# current; Licensing lives in the footer's Legal column only.
menu:
  main:
    - name: Research
      pageRef: /research
      weight: 10
    - name: Open Source
      pageRef: /open-source
      weight: 20
    - name: About
      pageRef: /about
      weight: 30
    - name: Contact
      pageRef: /contact
      weight: 40
