# Write-ups published outside this site's paper pages: blog articles,
# LinkedIn posts, and papers hosted elsewhere. Listed newest first on the
# Research page, and mixed with this site's papers in "Latest" on the home
# page. Add an entry when something publishes; nothing else needs to
# change when the work takes a new direction.
#
# Each entry (all required unless marked optional):
#   title    the write-up's title or opening line
#   kind     paper | article | post
#   url      where it lives
#   venue    where it was published, e.g. "LinkedIn", "andrewphunter.com"
#   date     YYYY-MM-DD
#   about    optional: the build or topic it came from, e.g. "Seymour";
#            also the filter tag on the Research page
#
# Only real, published links go here.
#
# What qualifies:
#   - articles and papers from the work, wherever published
#   - LinkedIn posts that stand on their own: a complete thought, or an
#     explanation of a repository or build
#   - not LinkedIn posts that only introduce or point to an article; list
#     the article instead
# LinkedIn permalinks are feed/update URLs built from each post's activity
# ID. Post titles quote a sentence from each post verbatim; article titles
# are the article's own title.

