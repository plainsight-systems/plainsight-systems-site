# Builds shown on the Projects page (all) and along the thread on the home
# page (the ones with art). Order matters: the most visual first.
# Describe each project's purpose and approach, without milestone numbers,
# progress labels, benchmark snapshots, or promises about the next release.
# Project sites carry the changing details.
#
# Each entry:
#   repo     GitHub owner/name (builds the github.com URL and fetches stats
#            at build time from the GitHub API)
#   question the question the build exists to answer, shown first on the
#            card
#   summary  curated one-liner shown on the card, so on-site copy stays
#            under our control whatever the repository description says
#   project_site optional project website, linked before the repository
#   feed     optional complete RSS article feed; refreshed automatically
#   writing_name display name for feed articles and their project filter
#   demo     optional URL of a live demo
#   image    optional art, a path under assets/ (original art only; see
#            ~/Documents/linkedin-posts/STYLE.md for the style); with it,
#            the build appears on the home page
#   alt      required with image: what the art shows
#   writeup  optional { label, url } for the build's main write-up

- repo: plainsight-systems/charlotte
  question: "What does inference cost when nothing is hidden?"
  summary: "A transformer inference engine written by hand in C++, compiled to WebAssembly, with compute in WebGPU and no framework. Running open-weight models in the browser lets me follow the cost of inference through the code, from loading weights to producing a token."
  demo: https://charlotte.plainsight-systems.com/
  image: images/builds/charlotte.jpg
  alt: "A small spider in a web of strung lights at night, with words woven into the threads."
  writeup:
    label: Debrief
    url: https://github.com/plainsight-systems/charlotte/blob/main/docs/debrief.md

- repo: plainsight-systems/dolittle
  project_site: https://dolittle.plainsight-systems.com/
  feed: https://dolittle.plainsight-systems.com/writing/index.xml
  writing_name: Dolittle
  question: "What do we learn from two views of a thinking model?"
  summary: "An experiment in comparing a model's generated thinking with natural language descriptions of its internal activations. I read Anthropic's work on natural language autoencoders and wanted to build the machinery myself, so I could inspect both views at the same point in a generation and explore where they agree or differ."
  image: images/builds/dolittle.png
  alt: "A green parrot speaks into a brass listening horn, with glowing marks becoming handwriting above an open notebook in a lamplit study."

- repo: plainsight-systems/serenity
  project_site: https://serenity.plainsight-systems.com/
  feed: https://serenity.plainsight-systems.com/writing/index.xml
  writing_name: Serenity
  question: "What can rendering teach us about GPU inference?"
  summary: "A C++ and Metal path tracer for exploring techniques that also matter to inference: processing work in small pieces, keeping a small amount of state, and reusing earlier work. ReSTIR shares sampled paths across pixels and frames; marbles lit by moving fireflies give me a picture at the end, where people can see what the kernel work makes possible."
  image: images/builds/serenity.jpg
  alt: "Glass and brass spheres on a table at night, lit by fireflies that settle into the outline of a small ship."

- repo: plainsight-systems/cradle
  project_site: https://cradle.plainsight-systems.com/
  feed: https://cradle.plainsight-systems.com/lessons/index.xml
  writing_name: Cradle
  question: "Can we build a transformer inference engine we can follow all the way through?"
  summary: "The code behind Let's Build a Transformer!, a practical series for .NET developers. We build one growing program in C# with ILGPU, write the GPU kernels ourselves, and introduce the math when the code needs it. Each lesson adds something we can run and check, following Jack Crenshaw's approach in Let's Build a Compiler!"
  image: images/builds/cradle.png
  alt: "A small electrical transformer rests in a wooden cradle under a brass desk lamp, with a red power lead trailing onto the workbench."

- repo: plainsight-systems/ariadne
  question: "What would an information-theoretic approach to attention look like?"
  summary: "A research program investigating attention through information theory, starting where the field started: Shannon's 1948 paper."
  image: images/builds/ariadne.jpg
  alt: "A relay-bank maze with a small mechanical mouse following a red thread toward the way out."

- repo: plainsight-systems/seymour
  question: "Why is a GPU with a petaflop of compute waiting on memory?"
  summary: "Take the chip apart, push a token through Llama 3.1 8B, and pull the throttles to see where decode stalls. H100 to MI355X."
  demo: https://plainsight-systems.github.io/seymour/
  image: images/builds/seymour.jpg
  alt: "A screenprint of a giant red plant swallowing a stack of memory chips carried by a small figure."

- repo: plainsight-systems/cpp-perf-guidelines
  question: "What does a performance engineer know that a model trained on average code does not?"
  summary: "The C++ performance technique layer below the ISO C++ Core Guidelines, every example compiled and checked."

- repo: plainsight-systems/mcp-servers
  question: "Can a coding agent use that knowledge while it works?"
  summary: "MCP servers in Rust that put the performance corpora in front of coding agents as they write code."
