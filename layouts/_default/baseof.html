<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
  <head>
    {{ partial "head.html" . }}
    {{ block "head-extra" . }}{{ end }}
  </head>
  <body class="{{ if .IsHome }}ps-home{{ else }}ps-inner{{ end }}">
    {{ partial "header.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
