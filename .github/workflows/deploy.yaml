name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ "main" ]
  # Weekly rebuild refreshes build-time GitHub stats on the Open Source
  # cards (fetched via resources.GetRemote in layouts/partials/repo-card.html)
  # so stars, forks, and last-pushed dates stay honest without a content push.
  # 06:00 UTC every Monday — off-hours for the primary time zones.
  schedule:
    - cron: "0 6 * * 1"
  # Manual trigger from the Actions tab, e.g. after publishing a new repo to
  # the org and updating data/featured_repos.yaml on a branch, or to force
  # a stats refresh sooner than the weekly schedule.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-plainsight-systems-com
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.2"
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Deploy (Wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler deploy
